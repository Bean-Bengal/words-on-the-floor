<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Words on the Floor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1d1b22;color:#eee;font-family:system-ui,sans-serif;text-align:center;padding:10px}
h1{font-size:22px;margin:6px 0}
#cat{cursor:pointer;display:inline-block;font-size:34px;user-select:none}
canvas{width:100%;max-width:660px;background:#2b2833;border:3px solid #4a4457;image-rendering:pixelated;display:block;margin:8px auto}
button{min-height:44px;min-width:44px;font-size:18px;margin:3px;border-radius:8px;border:0;background:#5a5370;color:#fff;padding:0 14px}
button:active{background:#8a7fb0}
#menu button{display:block;margin:8px auto;width:240px}
#rules{min-height:24px;color:#e9c46a;font-size:14px;margin:4px}
#msg{min-height:24px;color:#8fd694}
.hide{display:none}
</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script>
<h1>Words on the Floor</h1>
<div id="menu">
<div id="cat">🐱</div>
<p>Push the words. Change the rules. Arrows or WASD to move, Z undo, R restart.</p>
<div id="lv"></div>
</div>
<div id="game" class="hide">
<div id="rules"></div>
<canvas id="c" width="440" height="280"></canvas>
<div id="msg"></div>
<div>
<button id="bu">↑</button><br>
<button id="bl">←</button><button id="bd">↓</button><button id="br">→</button><br>
<button id="undo">Undo</button><button id="rst">Restart</button><button id="back">Menu</button>
</div>
</div>
<script>
var LEVELS=[
{name:"1  Walk",rows:[
".........",
".B.....F.",
".........",
".biy.....",
".fi..n..."]},
{name:"2  Wall",rows:[
"......W....",
".biy..W....",
".fin..W..F.",
"..B...W....",
"......W....",
".wis..W....",
"......W...."]},
{name:"3  Loose Word",rows:[
"...........",
".biy.......",
"...........",
".fi...n..F.",
".B........."]},
{name:"???",hidden:true,rows:[
"..........................",
".biy......................",
"..........................",
".fi......................n",
"..........................",
".B.......F................",
".........................."]}
];
var NOUN={b:'bean',f:'flag',w:'wall',r:'rock'},PROP={y:'you',p:'push',s:'stop',n:'win'};
var NAMES={bean:'BEAN',flag:'FLAG',wall:'WALL',rock:'ROCK',you:'YOU',push:'PUSH',stop:'STOP',win:'WIN',is:'IS'};
var OBJ={B:'bean',F:'flag',W:'wall',R:'rock'};
var cur=0,ents=[],W=0,H=0,hist=[],props={},won=false,camx=0,save=JSON.parse(localStorage.getItem('wotf')||'{"done":0,"hid":0}');
var cv=document.getElementById('c'),cx=cv.getContext('2d'),VW=11,VH=7,S=40;
function $(i){return document.getElementById(i)}
function load(i){
 cur=i;var L=LEVELS[i].rows;H=L.length;W=0;L.forEach(function(r){W=Math.max(W,r.length)});
 ents=[];hist=[];won=false;
 L.forEach(function(r,y){for(var x=0;x<W;x++){var ch=r[x]||'.';
  if(OBJ[ch])ents.push({t:'o',k:OBJ[ch],x:x,y:y});
  else if(NOUN[ch])ents.push({t:'n',k:NOUN[ch],x:x,y:y});
  else if(ch=='i')ents.push({t:'i',k:'is',x:x,y:y});
  else if(PROP[ch])ents.push({t:'p',k:PROP[ch],x:x,y:y});}});
 $('menu').classList.add('hide');$('game').classList.remove('hide');$('msg').textContent='';
 camx=0;calc();draw();
}
function at(x,y){return ents.filter(function(e){return e.x==x&&e.y==y})}
function wordAt(x,y,t){var l=at(x,y).filter(function(e){return e.t==t});return l[0]}
function rules(ents){
 var out=[];
 ents.forEach(function(e){if(e.t!='i')return;
  [[1,0],[0,1]].forEach(function(d){
   var a=wordAt(e.x-d[0],e.y-d[1],'n'),b=wordAt(e.x+d[0],e.y+d[1],'p');
   if(a&&b)out.push([a.k,b.k]);});});
 return out;
}
function calc(){
 props={};var rs=rules(ents);
 rs.forEach(function(r){(props[r[0]]=props[r[0]]||{})[r[1]]=1});
 $('rules').textContent=rs.map(function(r){return NAMES[r[0]]+' IS '+NAMES[r[1]]}).join('   ')||'no rules';
}
function has(e,p){return e.t=='o'&&props[e.k]&&props[e.k][p]}
function isPush(e){return e.t!='o'||has(e,'push')}
function clear(x,y,dx,dy,mv){
 if(x<0||y<0||x>=W||y>=H)return false;
 var l=at(x,y);
 for(var i=0;i<l.length;i++){var e=l[i];
  if(isPush(e)){if(!clear(x+dx,y+dy,dx,dy,mv))return false;mv.push(e);}
  else if(has(e,'stop'))return false;}
 return true;
}
function move(dx,dy){
 if(won)return;
 var snap=JSON.stringify(ents),moved=false;
 var you=ents.filter(function(e){return has(e,'you')});
 you.forEach(function(e){
  var mv=[];
  if(clear(e.x+dx,e.y+dy,dx,dy,mv)){
   mv.forEach(function(m){m.x+=dx;m.y+=dy});e.x+=dx;e.y+=dy;moved=true;}
 });
 if(moved){hist.push(snap);calc();
  var yy=ents.filter(function(e){return has(e,'you')});
  yy.forEach(function(y){if(at(y.x,y.y).some(function(e){return has(e,'win')}))won=true});
  if(won){
   if(cur+1>save.done&&!LEVELS[cur].hidden)save.done=cur+1;
   localStorage.setItem('wotf',JSON.stringify(save));
   $('msg').textContent=LEVELS[cur].hidden?'You found the way out. Nobody told you.':'Level clear.';
  }
 }
 draw();
}
function undo(){if(hist.length){ents=JSON.parse(hist.pop());won=false;$('msg').textContent='';calc();draw();}}
function draw(){
 var y0=ents.filter(function(e){return has(e,'you')})[0];
 if(y0)camx=Math.max(0,Math.min(W-VW,y0.x-5));
 if(W<=VW)camx=0;
 var vw=Math.min(VW,W);
 cx.clearRect(0,0,440,280);
 var ox=(VW-vw)*S/2;
 ents.slice().sort(function(a,b){return (a.t=='o'?0:1)-(b.t=='o'?0:1)}).forEach(function(e){
  var px=ox+(e.x-camx)*S,py=e.y*S;
  if(e.x<camx||e.x>=camx+vw)return;
  if(e.t=='o')obj(e,px,py);else word(e,px,py);
 });
 cx.strokeStyle='rgba(255,255,255,.05)';
 for(var i=0;i<=vw;i++){cx.beginPath();cx.moveTo(ox+i*S,0);cx.lineTo(ox+i*S,H*S);cx.stroke();}
 if(camx+vw<W){cx.fillStyle='#e9c46a';cx.font='20px sans-serif';cx.fillText('›',430,272)}
 if(camx>0){cx.fillStyle='#e9c46a';cx.font='20px sans-serif';cx.fillText('‹',4,272)}
}
function obj(e,x,y){
 if(e.k=='bean'){cx.fillStyle='#d9a05b';cx.beginPath();cx.arc(x+20,y+23,13,0,7);cx.fill();
  cx.beginPath();cx.moveTo(x+8,y+14);cx.lineTo(x+12,y+4);cx.lineTo(x+19,y+12);cx.fill();
  cx.beginPath();cx.moveTo(x+32,y+14);cx.lineTo(x+28,y+4);cx.lineTo(x+21,y+12);cx.fill();
  cx.fillStyle='#2a2622';cx.fillRect(x+14,y+20,3,4);cx.fillRect(x+24,y+20,3,4);cx.fillRect(x+13,y+14,3,3);cx.fillRect(x+25,y+27,3,3);}
 else if(e.k=='flag'){cx.fillStyle='#ccc';cx.fillRect(x+12,y+6,3,28);cx.fillStyle='#e9c46a';cx.beginPath();cx.moveTo(x+15,y+6);cx.lineTo(x+32,y+13);cx.lineTo(x+15,y+20);cx.fill();}
 else if(e.k=='wall'){cx.fillStyle='#7a6f8f';cx.fillRect(x+1,y+1,38,38);cx.fillStyle='#5a5370';cx.fillRect(x+1,y+19,38,2);cx.fillRect(x+19,y+1,2,18);cx.fillRect(x+9,y+21,2,18);cx.fillRect(x+29,y+21,2,18);}
 else{cx.fillStyle='#9b6b43';cx.beginPath();cx.arc(x+20,y+22,14,0,7);cx.fill();}
}
function word(e,x,y){
 var c=e.t=='n'?'#e76f51':e.t=='i'?'#f4f1de':'#4cc9a0';
 cx.fillStyle='#3a3548';cx.fillRect(x+2,y+2,36,36);
 cx.strokeStyle=c;cx.lineWidth=2;cx.strokeRect(x+3,y+3,34,34);cx.lineWidth=1;
 cx.fillStyle=c;cx.font='bold 11px monospace';cx.textAlign='center';cx.fillText(NAMES[e.k],x+20,y+24);cx.textAlign='left';
}
function menu(){
 $('game').classList.add('hide');$('menu').classList.remove('hide');
 var h='';LEVELS.forEach(function(L,i){
  if(L.hidden&&!save.hid)return;
  var ok=i<=save.done||L.hidden;
  h+='<button '+(ok?'':'disabled style="opacity:.4"')+' onclick="load('+i+')">'+L.name+'</button>';});
 $('lv').innerHTML=h;
}
var taps=0;
$('cat').onclick=function(){taps++;if(taps>=3&&!save.hid){save.hid=1;localStorage.setItem('wotf',JSON.stringify(save));menu();}};
$('bu').onclick=function(){move(0,-1)};$('bd').onclick=function(){move(0,1)};
$('bl').onclick=function(){move(-1,0)};$('br').onclick=function(){move(1,0)};
$('undo').onclick=undo;$('rst').onclick=function(){load(cur)};$('back').onclick=menu;
window.onkeydown=function(e){
 var k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
 if($('game').classList.contains('hide'))return;
 if(m){e.preventDefault();move(m[0],m[1]);}
 else if(k=='z')undo();else if(k=='r')load(cur);
};
menu();
</script></body></html>
